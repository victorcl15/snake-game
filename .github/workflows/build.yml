# ============================================================
# GitHub Actions - Build & Push Workflow
# Build Docker images and push to Docker Hub/Ghcr.io
# ============================================================

name: Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  workflow_run:
    workflows: [ "Test" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/snake-game-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/snake-game-frontend:${{ github.sha }}

      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .docker/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/snake-game-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/snake-game-backend:${{ github.sha }}

      - name: Build DevTools Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .docker/Dockerfile.devtools
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/snake-game-devtools:latest
            ${{ secrets.DOCKER_USERNAME }}/snake-game-devtools:${{ github.sha }}
