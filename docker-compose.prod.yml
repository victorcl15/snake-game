# ============================================================
# SNAKE GAME 3D - Docker Compose Production Overrides
# ============================================================

version: '3.9'

services:
  mongodb:
    restart: always
    environment:
      MONGO_DB_NAME: snake_game_prod
    volumes:
      - mongodb_prod_data:/data/db:rw

  backend:
    restart: always
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://user:password@cluster.mongodb.net/snake_game}
    volumes: []

  frontend:
    restart: always
    environment:
      NODE_ENV: production
      VITE_API_URL: ${API_URL:-https://api.snake-game.com}
      VITE_SOCKET_URL: ${SOCKET_URL:-https://socket.snake-game.com}
    volumes: []

  devtools:
    deploy:
      replicas: 0

  nginx:
    environment:
      - SSL_CERT_PATH=/etc/nginx/ssl/cert.pem
      - SSL_KEY_PATH=/etc/nginx/ssl/key.pem
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: always

volumes:
  mongodb_prod_data:
    driver: local
