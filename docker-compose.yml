# ============================================================
# SNAKE GAME 3D - Docker Compose Configuration
# Development environment with 6 microservices
# ============================================================

services:
  # ============================================================
  # DATABASE - MongoDB
  # ============================================================
  mongodb:
    image: mongo:6.0
    container_name: snake-game-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-snake_game}
    volumes:
      - mongodb_data:/data/db
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - snake-network
    healthcheck:
      test: echo 'db.adminCommand("ping")' | mongosh -u admin -p admin-password --authenticationDatabase admin localhost:27017/snake_game || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ============================================================
  # BACKEND - Express + Socket.io
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: .docker/Dockerfile.backend
    container_name: snake-game-backend
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      SOCKET_PORT: 4001
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin-password}@mongodb:27017/${MONGO_DB_NAME:-snake_game}?authSource=admin
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-prod}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/dist:/app/dist
    networks:
      - snake-network
    healthcheck:
      test: curl -f http://localhost:4000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  # FRONTEND - React 18 + Babylon.js
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: .docker/Dockerfile.frontend
    container_name: snake-game-frontend
    ports:
      - "3000:80"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: http://localhost:4000
      VITE_SOCKET_URL: http://localhost:4001
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - snake-network
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ============================================================
  # DEVELOPMENT TOOLS - ESLint, Vitest, Playwright
  # ============================================================
  devtools:
    build:
      context: .
      dockerfile: .docker/Dockerfile.devtools
    container_name: snake-game-devtools
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app/frontend
      - ./backend:/app/backend
    networks:
      - snake-network
    restart: unless-stopped

  # ============================================================
  # REVERSE PROXY - Nginx
  # ============================================================
  nginx:
    image: nginx:1.25
    container_name: snake-game-nginx
    ports:
       - "8080:80"
       - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - snake-network
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:80/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  snake-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mongodb_data:
    driver: local
