# ============================================================
# Nginx Configuration for Frontend (React SPA)
# Single Page Application routing + caching
# ============================================================

location / {
    proxy_pass http://frontend_app;
    proxy_http_version 1.1;
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Rate limiting
    limit_req zone=general burst=20 nodelay;
}

# ============================================================
# Static assets - Aggressive caching
# ============================================================
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://frontend_app;
    proxy_cache_valid 200 365d;
    proxy_cache_bypass $http_pragma $http_authorization;
    
    # Cache headers for browser
    add_header Cache-Control "public, immutable, max-age=31536000";
    add_header ETag "\"static-assets\"";
    
    # Compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}

# ============================================================
# HTML files - No cache (for app shell)
# ============================================================
location ~* \.html?$ {
    proxy_pass http://frontend_app;
    
    # No cache for HTML
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header ETag "\"html\"";
}

# ============================================================
# Service Worker - Cache but validate
# ============================================================
location ~ ^/sw\.js$ {
    proxy_pass http://frontend_app;
    
    add_header Cache-Control "public, max-age=3600";
    add_header Service-Worker-Allowed "/";
}

# ============================================================
# Manifest - Short cache
# ============================================================
location ~ (manifest\.json|favicon\.ico)$ {
    proxy_pass http://frontend_app;
    
    add_header Cache-Control "public, max-age=86400";
}

# ============================================================
# SPA Routing - Route unknown paths to index.html
# ============================================================
error_page 404 =200 /index.html;
