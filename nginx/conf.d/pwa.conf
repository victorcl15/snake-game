# ============================================================
# Nginx Configuration for WebSocket (Socket.io)
# Real-time multiplayer, live updates
# ============================================================

location /socket.io {
    proxy_pass http://socket_io/socket.io;
    proxy_http_version 1.1;
    
    # WebSocket upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Timeouts for long-lived connections
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
    
    # Buffering disabled for streaming
    proxy_buffering off;
    
    # Rate limiting: 50 req/s per IP (WebSocket)
    limit_req zone=websocket burst=100 nodelay;
}

# ============================================================
# Game Rooms (real-time updates)
# ============================================================
location /api/rooms/ {
    proxy_pass http://backend_api/api/rooms/;
    proxy_http_version 1.1;
    
    # WebSocket upgrade for SSE or socket.io
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Streaming timeouts
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
    
    # No buffering for streaming
    proxy_buffering off;
    
    # Rate limiting: 50 req/s
    limit_req zone=websocket burst=100 nodelay;
}

# ============================================================
# Leaderboard (real-time updates)
# ============================================================
location /api/leaderboard {
    proxy_pass http://backend_api/api/leaderboard;
    proxy_http_version 1.1;
    
    # Cache for 30 seconds
    proxy_cache_valid 200 30s;
    proxy_cache_bypass $http_pragma $http_authorization;
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # Rate limiting
    limit_req zone=websocket burst=50 nodelay;
}

# ============================================================
# Game Events (SSE or WebSocket)
# ============================================================
location /api/events {
    proxy_pass http://backend_api/api/events;
    proxy_http_version 1.1;
    
    # WebSocket upgrade
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # No cache for events
    proxy_cache_bypass $http_pragma;
    
    # Streaming
    proxy_buffering off;
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
    
    # Rate limiting
    limit_req zone=websocket burst=100 nodelay;
}
