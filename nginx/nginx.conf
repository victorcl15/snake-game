# ============================================================
# NGINX Main Configuration
# Rate limiting, compression, security headers
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================
    # Logging
    # ============================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ============================================================
    # Performance
    # ============================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ============================================================
    # Gzip Compression
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ============================================================
    # Rate Limiting Zones
    # ============================================================
    
    # General rate limit: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    
    # API rate limit: 30 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    
    # WebSocket rate limit: 50 requests per second per IP
    limit_req_zone $binary_remote_addr zone=websocket:10m rate=50r/s;

    # ============================================================
    # Upstream Backends
    # ============================================================
    upstream backend_api {
        server backend:4000;
    }

    upstream socket_io {
        server backend:4001;
    }

    upstream frontend_app {
        server frontend:3000;
    }

    # ============================================================
    # HTTPS Redirect (if SSL certificates available)
    # ============================================================
    # Uncomment in production:
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # ============================================================
    # HTTP Server
    # ============================================================
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ============================================================
        # Frontend SPA (React)
        # ============================================================
        include /etc/nginx/conf.d/frontend.conf;

        # ============================================================
        # Backend API (Express)
        # ============================================================
        include /etc/nginx/conf.d/api.conf;

        # ============================================================
        # WebSocket (Socket.io)
        # ============================================================
        include /etc/nginx/conf.d/pwa.conf;

        # ============================================================
        # Health Check
        # ============================================================
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
